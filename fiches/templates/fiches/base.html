<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fiches Techniques{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .navbar-brand { font-weight: 600; }
        .card-nutrition .value { font-size: 1.4rem; font-weight: 700; }
        .card-nutrition .label { font-size: .75rem; text-transform: uppercase; color: #6c757d; letter-spacing: .04em; }
        table.table thead th { background-color: #1f2d3d; color: #fff; font-size: .85rem; }
        .badge-non-mappe { font-size: .7rem; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'fiches:liste' %}">
            <i class="bi bi-clipboard2-pulse"></i> Gestion des Fiches Techniques &ndash; Nutrition
        </a>
    </div>
</nav>
<div class="container-fluid px-4">
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
